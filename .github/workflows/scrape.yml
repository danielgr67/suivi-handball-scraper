name: Synchronisation FFHB

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lancer le scraper
        env:
          IMPORT_URL: ${{ secrets.IMPORT_URL }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
        run: php scraper_github.php
